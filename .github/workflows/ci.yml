name: Foundation CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned development toolchain
        run: rustup toolchain install 1.74.0 --profile minimal --component rustfmt --component clippy
      - name: Check tracked files
        run: python3 scripts/check-staged.py --all
      - name: Run shared checks
        run: sh scripts/check.sh
