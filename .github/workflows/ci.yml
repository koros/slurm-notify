name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned development toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
      - name: Check tracked files
        run: python3 scripts/check-staged.py --all
      - name: Run shared checks
        run: sh scripts/check.sh
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  coverage:
    name: Rust coverage (at least 90%)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install project compiler and matching LLVM tools
        run: rustup toolchain install 1.88.0 --profile minimal --component llvm-tools-preview
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov@0.6.21
          fallback: none
      - name: Enforce workspace line coverage
        run: sh scripts/check-coverage.sh
      - name: Upload coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage
          path: target/coverage/
          if-no-files-found: warn
          retention-days: 14

  workflow-lint:
    name: Workflow validation
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-pinned Actionlint
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - run: '"$RUNNER_TEMP/actionlint" -color'

  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          license-check: false

  development-build:
    name: Development CLI artifact
    needs: [rust, coverage, workflow-lint]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned development compiler
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Build and smoke-check development CLI
        shell: bash
        run: |
          cargo build --workspace --release --locked
          set +e
          output=$(target/release/slurm-notify 2>&1)
          status=$?
          set -e
          test "$status" -eq 2
          test "$output" = "Usage: slurm-notify --help | --version"
          target/release/slurm-notify --help > target/cli-help.stdout
          cmp contracts/cli/help.stdout target/cli-help.stdout
          target/release/slurm-notify --version > target/cli-version.stdout
          cmp contracts/cli/version.stdout target/cli-version.stdout
          mkdir -p target/development-artifact
          cp target/release/slurm-notify target/development-artifact/
          cp README.md LICENSE target/development-artifact/
          cd target/development-artifact
          sha256sum slurm-notify > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: development-cli-linux-x86_64
          path: target/development-artifact/
          if-no-files-found: error
          retention-days: 7

  coverage-report:
    name: Publish main coverage
    needs: [coverage]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-coverage
          path: coverage
      - name: Upload measured LCOV to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false
