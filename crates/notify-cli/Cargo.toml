[package]
name = "slurm-notify"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[[bin]]
name = "slurm-notify"
path = "src/main.rs"

[dependencies]
# Installed strict bounded configuration boundary; retain existing locked versions.
serde_json = "=1.0.152"
serde_core = "=1.0.229"
zeroize = "=1.8.1"
url = "=2.5.8"
libc = "=0.2.190"

# Existing locked hashing, strict address parsing and trust-anchor validation.
ring = "=0.17.14"
lettre = { version = "=0.11.22", default-features = false, features = ["builder"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }

# Existing read-only SQLite inspection and strict checkpoint timestamps.
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "hooks"] }
time = "=0.3.55"

# Installed bounded HTTPS helper; reuse locked TLS client without proxy discovery/decompression.
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
httpdate = "=1.0.3"

# Bound SMTP helper AUTH PLAIN; retain the locked scalar implementation.
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }

[dev-dependencies]
# Retain unrelated builder transitive versions during the security update.
email-encoding = "=0.4.1"
idna_adapter = "=1.1.0"
# Loopback TLS fixtures generated in memory; no checked-in private keys.
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
# Explicit formatting dependency version for reproducible private TLS fixtures.
powerfmt = { version = "=0.2.1", default-features = false }

# Private process-boundary acceptance harness; not an installed helper binary.
[[test]]
name = "transport_boundary"
path = "../../tests/integration/transport_boundary.rs"
harness = false
