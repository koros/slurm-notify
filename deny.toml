# Review license/advisory changes deliberately; never add blanket advisory ignores.
[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"

[licenses]
include-dev = true
confidence-threshold = 0.93
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "0BSD", "CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
